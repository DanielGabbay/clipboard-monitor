<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#3a3fd8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef1f8"/>
    </linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6478"/><stop offset="1" stop-color="#363c4b"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1050" flood-opacity=".35"/>
    </filter>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <!-- macOS app icon grid: 824px squircle centred in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="3"/>
  <!-- clipboard sheet -->
  <rect x="262" y="230" width="500" height="620" rx="56" fill="url(#paper)" filter="url(#sh)"/>
  <!-- clip -->
  <rect x="397" y="190" width="230" height="96" rx="30" fill="url(#clip)" filter="url(#sh2)"/>
  <rect x="467" y="212" width="90" height="22" rx="11" fill="#1f2330" opacity=".55"/>
  <!-- RTL line: Hebrew letter on the right, text bars growing leftwards -->
  <text x="694" y="440" text-anchor="end" font-family="Arial Hebrew, Noto Sans Hebrew, Arial, sans-serif" font-weight="700" font-size="118" fill="#3a3fd8">א</text>
  <rect x="330" y="372" width="270" height="34" rx="17" fill="#c9d3ec"/>
  <rect x="420" y="476" width="274" height="30" rx="15" fill="#d8dff0"/>
  <!-- LTR line: Latin letter on the left -->
  <text x="324" y="640" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="112" fill="#4f8cff">A</text>
  <rect x="424" y="572" width="270" height="34" rx="17" fill="#c9d3ec"/>
  <rect x="330" y="676" width="274" height="30" rx="15" fill="#d8dff0"/>
  <!-- direction arrows -->
  <g fill="none" stroke="#3a3fd8" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M432 744 H590"/><path d="M562 720 L592 744 L562 768"/>
    <path d="M592 790 H434"/><path d="M462 766 L432 790 L462 814"/>
  </g>
</svg>

# Builds the app on macOS for every push and pull request, so compile errors show up without a local Mac.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # build.sh uses the commit count as the build number
      - name: Toolchain
        run: |
          sw_vers
          xcrun swiftc --version
      - name: Build
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log
          # build.sh keeps going on warnings; fail on any compiler error line.
          if grep -E "^[^ ]+\.swift:[0-9]+:[0-9]+: error:" build.log; then exit 1; fi
      - name: Check page scripts
        run: for f in Resources/*.js; do node --check "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

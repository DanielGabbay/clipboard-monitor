<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Actions</title>
<link rel="stylesheet" href="actions.css">
</head>
<body>
<!-- Text Actions popover (ActionsController.swift). Esc or a click outside closes it. -->
<div id="card" role="dialog" aria-live="polite">
  <!-- The list of actions for the selected text -->
  <div id="v-list" hidden>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M8 2l1.5 4.5L14 8l-4.5 1.5L8 14l-1.5-4.5L2 8l4.5-1.5z"/></svg>
      <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-placeholder="actions.search" aria-controls="list">
    </div>
    <div id="chip" class="chip" dir="auto"></div>
    <div id="list" role="listbox"></div>
    <div class="foot">
      <span class="keys"><kbd>↵</kbd> <span data-i18n="actions.key.run">Run</span></span>
      <span class="keys"><kbd>↑↓</kbd> <span data-i18n="actions.key.choose">Choose</span></span>
      <span class="keys"><kbd>Esc</kbd> <span data-i18n="actions.key.close">Close</span></span>
      <span class="grow"></span>
      <select id="model" dir="auto" data-i18n-title="actions.model.title"></select>
      <button id="nomodel" class="link" hidden data-i18n="actions.model.setup">Set up AI</button>
    </div>
  </div>
  <!-- Progress, the result, or a message -->
  <div id="v-work" hidden>
    <div class="head">
      <button id="back" class="tb" data-i18n-title="actions.back.title" hidden><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="flip" d="M10 3L5 8l5 5"/></svg></button>
      <span id="title" class="name" dir="auto"></span>
      <span class="grow"></span>
      <button id="close" class="tb" data-i18n-title="actions.close.title"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="body">
      <div id="text" class="text"></div>
      <div id="status" class="status"></div>
      <button id="link" class="link" hidden></button>
    </div>
    <div class="foot" id="result-foot" hidden>
      <button id="replace" class="btn" data-i18n="actions.replace">Replace</button>
      <button id="copy" class="btn" data-i18n="actions.copy">Copy</button>
      <span class="grow"></span>
      <span class="keys" id="primary-key"><kbd>↵</kbd> <span id="primary-label"></span></span>
    </div>
  </div>
</div>
<script src="i18n.js"></script>
<script src="actions.js"></script>
</body>
</html>
